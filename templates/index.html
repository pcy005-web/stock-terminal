<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 마켓 시황 및 트렌드 요약</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .section-box {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 18px;
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        ul {
            margin: 0;
            padding-left: 20px;
        }
        li {
            margin-bottom: 10px;
            line-height: 1.5;
            color: #e2e8f0;
        }
        .related-stocks-container {
            margin-top: 15px;
            border-top: 1px solid #334155;
            padding-top: 12px;
        }
        .label {
            font-size: 13px;
            color: #94a3b8;
            display: block;
            margin-bottom: 8px;
        }
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .stock-tag-btn {
            background: #334155;
            color: #f1f5f9;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 실시간 금융 마켓 대시보드</h1>

        <!-- 5. 장전 5분 마켓 핵심 요약 섹션 -->
        <div class="section-box">
            <div class="section-title">
                <span>5. 장전 5분 마켓 핵심 요약</span>
            </div>
            
            <!-- 파이썬에서 전달받은 마크다운 불릿 리스트 출력 (중복 점 제거 적용) -->
            <ul>
                {% for bullet in market_summary_bullets %}
                    <li>{{ bullet }}</li>
                {% endfor %}
            </ul>
            
            <!-- 실시간 뉴스 데이터 기반 관련 종목 버튼 영역 -->
            <div class="related-stocks-container">
                <span class="label">관련 핵심 주목 종목 및 주도주:</span>
                <div class="button-group">
                    {% for news in news_list[:3] %}
                        <span class="stock-tag-btn">{{ news.stock }}</span>
                    {% endfor %}
                </div>
            </div>
        </div>

    </div>
</body>
</html>
