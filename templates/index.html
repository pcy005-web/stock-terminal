    </div>
</div>

<script>
    let lastFeatureTitles = "{{ feature_stocks | map(attribute='title') | join('||') }}";

    // 10초마다 특징주 및 마감시황 영역을 부드러운 깜박임(Fade)과 함께 백그라운드 갱신
    setInterval(async () => {
        try {
            const res = await fetch('/api/feature-stocks');
            const data = await res.json();
            
            const newTitles = data.feature_stocks.map(item => item.title).join('||');
            
            if (newTitles !== lastFeatureTitles) {
                lastFeatureTitles = newTitles;
                
                const container = document.getElementById('feature-stocks-container');
                const summaryContainer = document.getElementById('market-summary-container');
                
                // 1. 투명도를 낮추어 깜박이는 시각적 효과 시작 (Fade Out)
                container.classList.add('fade-out');
                summaryContainer.classList.add('fade-out');
                
                setTimeout(() => {
                    // 2. 새로운 데이터로 HTML 내용 교체
                    let htmlContent = '';
                    data.feature_stocks.forEach(item => {
                        htmlContent += `
                        <div class="card">
                            <div class="stock-title">📌 ${item.stock}</div>
                            <div class="badge">${item.theme}</div>
                            <a href="${item.link}" target="_blank" class="news-link">${item.title}</a>
                        </div>`;
                    });
                    container.innerHTML = htmlContent;
                    summaryContainer.innerText = data.feature_market_summary;
                    
                    // 3. 다시 선명하게 복원 (Fade In)
                    container.classList.remove('fade-out');
                    summaryContainer.classList.remove('fade-out');
                }, 300);
            }
        } catch (e) {
            console.error("실시간 갱신 실패:", e);
        }
    }, 10000);
</script>

</body>
</html>
