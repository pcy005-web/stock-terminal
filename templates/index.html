<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 주식 증시 및 시황 대시보드</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #38bdf8; border-left: 4px solid #38bdf8; padding-left: 10px; }
        .ai-briefing-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; color: #f8fafc; margin-top: 15px; }
        .feature-item { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 실시간 증시 및 스마트머니 대시보드</h1>

        <!-- 7. 장중 특징주 핫이슈 및 수급 분석 영역 -->
        <div style="margin-top: 30px;">
            <div class="section-title">7. 장중 특징주 핫이슈 (실시간)</div>
            
            <!-- 특징주 리스트 컨테이너 -->
            <div id="feature-stocks-container">
                {% for item in feature_stocks %}
                <div class="feature-item">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <span style="font-weight: bold; color: #38bdf8; font-size: 1rem;">📌 {{ item.stock }}</span>
                        <span style="background: #0f172a; color: #38bdf8; padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; border: 1px solid #334155;">{{ item.theme }}</span>
                    </div>
                    <a href="{{ item.link }}" target="_blank" style="color: #f8fafc; text-decoration: none; font-size: 0.95rem; display: block;">
                        {{ item.title }}
                    </a>
                </div>
                {% endfor %}
            </div>

            <!-- 장중 수급 분석 (AI 브리핑 박스 포맷 적용) -->
            <div class="ai-briefing-box">
                <div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 12px; color: #38bdf8; display: flex; align-items: center; gap: 8px;">
                    <span>📊</span> 장중 수급 및 마감시황 종합 분석
                </div>
                <div id="feature-market-summary-content" style="line-height: 1.6; white-space: pre-line; font-size: 0.95rem; color: #e2e8f0;">
                    {{ feature_market_summary }}
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript: 데이터 변경 감지 시에만 갱신하여 깜박임 방지 -->
    <script>
        let lastFeatureTitles = "";

        function updateFeatureStocks() {
            fetch('/api/feature-stocks')
                .then(response => response.json())
                .then(data => {
                    let items = data.feature_stocks;
                    let marketSummary = data.feature_market_summary;
                    
                    let currentTitles = items.map(item => item.title).join("||");
                    
                    // 💡 이전 데이터와 타이틀이 완벽히 동일하면 화면을 다시 그리지 않음 (깜박임 차단)
                    if (currentTitles === lastFeatureTitles) {
                        return; 
                    }
                    
                    lastFeatureTitles = currentTitles;
                    
                    let html = '';
                    items.forEach(item => {
                        html += `
                            <div class="feature-item">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                                    <span style="font-weight: bold; color: #38bdf8; font-size: 1rem;">📌 ${item.stock}</span>
                                    <span style="background: #0f172a; color: #38bdf8; padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; border: 1px solid #334155;">${item.theme}</span>
                                </div>
                                <a href="${item.link}" target="_blank" style="color: #f8fafc; text-decoration: none; font-size: 0.95rem; display: block;">
                                    ${item.title}
                                </a>
                            </div>
                        `;
                    });
                    
                    let container = document.getElementById('feature-stocks-container');
                    if (container) {
                        container.innerHTML = html;
                    }
                    
                    let summaryContainer = document.getElementById('feature-market-summary-content');
                    if (summaryContainer && marketSummary) {
                        summaryContainer.innerHTML = marketSummary;
                    }
                })
                .catch(err => console.error('특징주 갱신 실패:', err));
        }

        // 15초마다 주기적으로 확인하되, 내용 변경이 있을 때만 자연스럽게 반영됨
        setInterval(updateFeatureStocks, 15000);
    </script>
</body>
</html>
