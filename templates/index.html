<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Market Dashboard</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-red: #ef4444;   /* 상승: 빨간색 */
            --accent-blue: #3b82f6;  /* 하락: 파란색 */
            --accent-main: #38bdf8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 16px; font-size: 13px; max-width: 1200px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .logo { font-size: 1.2rem; font-weight: 800; color: var(--accent-main); }
        
        .group-container { margin-bottom: 24px; }
        .group-title { font-size: 0.95rem; font-weight: 700; color: var(--accent-main); margin-bottom: 10px; border-left: 3px solid var(--accent-main); padding-left: 8px; }

        .card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .card-title { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-val { font-size: 1.05rem; font-weight: 700; }
        
        .up { color: var(--accent-red); }
        .down { color: var(--accent-blue); }

        .grid-custom { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
        }
        @media (max-width: 768px) {
            .grid-custom { grid-template-columns: repeat(2, 1fr); }
        }

        .btn-wrap { margin-top: 15px; margin-bottom: 30px; }
        .btn { padding: 12px; border-radius: 8px; border: none; background: var(--accent-main); color: #0f172a; font-weight: 700; cursor: pointer; width: 100%; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">📊 글로벌 실시간 금융 시세 대시보드</div>
    </header>

    {% for cat in categories %}
    <div class="group-container">
        <div class="group-title">{{ cat.title }}</div>
        <div class="grid-custom">
            {% for stock in cat.stocks %}
            <div class="card" id="card-{{ stock.code }}">
                <div class="card-title">{{ stock.name }}</div>
                <div class="card-val" id="val-{{ stock.code }}">
                    불러오는 중...<br>
                    <span style="font-size:0.75rem; font-weight: 600;">+0.00%</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}

    <div class="btn-wrap">
        <button class="btn" onclick="loadMarketData()">🔄 시세 새로고침</button>
    </div>

    <script>
        const stockList = [
            {% for cat in categories %}
                {% for stock in cat.stocks %}
                    { code: "{{ stock.code }}", symbol: "{{ stock.symbol }}" },
                {% endfor %}
            {% endfor %}
        ];

        async function loadMarketData() {
            for (const item of stockList) {
                const el = document.getElementById(`val-${item.code}`);
                try {
                    const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(item.symbol)}?interval=1d&range=2d`;
                    // CORS 우회 퍼블릭 프록시 적용
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                    
                    const res = await fetch(proxyUrl);
                    const data = await res.json();
                    
                    const meta = data.chart.result[0].meta;
                    let cur = meta.regularMarketPrice;
                    let prev = meta.chartPreviousClose || meta.previousClose;
                    
                    if (!cur || !prev) {
                        const quotes = data.chart.result[0].indicators.quote[0].close;
                        const valid = quotes.filter(q => q !== null);
                        if (valid.length >= 2) {
                            cur = valid[valid.length - 1];
                            prev = valid[valid.length - 2];
                        }
                    }

                    const diff = cur - prev;
                    const rate = prev ? (diff / prev) * 100 : 0;
                    const isUp = diff >= 0;

                    el.className = `card-val ${isUp ? 'up' : 'down'}`;
                    el.innerHTML = `${cur.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}<br>` +
                                   `<span style="font-size:0.75rem; font-weight: 600;">${rate >= 0 ? '+' : ''}${rate.toFixed(2)}%</span>`;
                } catch (err) {
                    el.innerHTML = `값 로딩 실패<br><span style="font-size:0.75rem; font-weight: 600;">+0.00%</span>`;
                }
            }
        }

        loadMarketData();
    </script>

</body>
</html>
