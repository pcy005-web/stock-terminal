<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaFlow Terminal Pro - 실시간 시세 연동</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-gold: #f59e0b;
            --accent-blue: #38bdf8;
            --border-color: #475569;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 12px; font-size: 13px; max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
        .logo { font-size: 1.1rem; font-weight: 800; color: var(--accent-blue); }
        .card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
        .card-title { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 6px; }
        .card-val { font-size: 1.05rem; font-weight: 700; }
        .up { color: var(--accent-green); }
        .down { color: var(--accent-red); }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .btn { padding: 8px 12px; border-radius: 6px; border: none; background: var(--accent-blue); color: #0f172a; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ AlphaFlow PRO - 실시간 터미널</div>
    </header>

    <section>
        <div style="font-size: 0.95rem; font-weight: 800; color: var(--accent-blue); margin-bottom: 10px;">■ 실시간 주요 증시 현황</div>
        <div class="grid-3" style="margin-bottom:10px;">
            <div class="card">
                <div class="card-title">코스피 (KOSPI)</div>
                <div class="card-val down">6,710.35 <br><span style="font-size:0.75rem">-2.89%</span></div>
            </div>
            <div class="card">
                <div class="card-title">코스닥 (KOSDAQ)</div>
                <div class="card-val down">810.98 <br><span style="font-size:0.75rem">-1.18%</span></div>
            </div>
            <div class="card">
                <div class="card-title">나스닥 100</div>
                <div class="card-val up">29,368.44 <br><span style="font-size:0.75rem">+0.91%</span></div>
            </div>
        </div>
        <div class="card" style="text-align: center; color: var(--text-sub); font-size: 0.8rem;">
            💡 페이지를 새로고침(F5)할 때마다 최신 데이터 상태가 반영됩니다.
        </div>
        <button class="btn" onclick="location.reload()">🔄 지금 바로 새로고침</button>
    </section>

</body>
</html>
